name: CI

on:
  push:
    branches: [master, coq-8.20]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: '8.20.1'
          ocaml_version: '4.14.2-flambda'
          custom_script: |
            startGroup "Install the mathcomp fork"
              opam pin add -y -n coq-mathcomp-ssreflect https://github.com/Coq-Polyhedra/mathcomp.git#coq-8.20
              opam install -y -j 2 coq-mathcomp-ssreflect
            endGroup
            startGroup "Build finmap"
              sudo chown -R coq:coq .
              opam pin add -y -n coq-mathcomp-finmap .
              opam install -y -j 2 coq-mathcomp-finmap
            endGroup
